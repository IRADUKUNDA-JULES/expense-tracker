<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Edit Expense</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container my-4" style="max-width: 500px;">
  <h1 class="mb-4">Edit Expense</h1>

  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for type, message in messages %}
      <div class="alert alert-{{ 'success' if type == 'success' else 'danger' }}">{{ message }}</div>
    {% endfor %}
  {% endwith %}

  <form method="POST" class="card p-3">
    <input class="form-control mb-2" name="title" value="{{ expense.title }}" required>
    <input class="form-control mb-2" name="amount" type="number" step="0.01" value="{{ expense.amount }}" required>
    <input class="form-control mb-3" name="category" value="{{ expense.category }}" required>
    <button class="btn btn-primary" type="submit">Save</button>
    <a class="btn btn-link" href="/">Cancel</a>
  </form>
</div>
</body>
</html>
